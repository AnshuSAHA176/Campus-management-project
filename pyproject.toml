version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cloudinary>=1.46.2",
    "django>=5.2.17",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
